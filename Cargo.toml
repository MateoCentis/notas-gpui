[package]
name = "notas"
version = "0.2.0"
edition = "2024"
description = "Bloc de notas minimalista con Markdown y listas de tareas"

[dependencies]
# GPUI aún no es 1.0: se fija la versión exacta para que una actualización no rompa la build.
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-markdown"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
